name: Sync LAU events
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scrape-lau-events.mjs
      - run: |
          git config user.name "laus-bot"
          git config user.email "laus-bot@local"
          git add public/lau-events.json
          git diff --cached --quiet || git commit -m "Sync LAU events"
          git push
